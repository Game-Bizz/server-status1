<!DOCTYPE html>
<html>
  <head>
    <title>The Bollucks SMP - Status</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
      body {
        background: radial-gradient(circle, #111 0%, #000 100%);
        color: white;
        font-family: "Segoe UI", sans-serif;
        text-align: center;
        padding: 3em;
      }
      .card {
        background: #1a1a1a;
        border-radius: 15px;
        padding: 20px 40px;
        box-shadow: 0 0 15px #000;
        display: inline-block;
        margin-top: 2em;
      }
      .online { color: #4caf50; }
      .offline { color: #f44336; }
    </style>
  </head>
  <body>
    <h1>🧒 The Bollucks SMP - Server Status</h1>
    <div class="card">
      <p id="status">Loading...</p>
      <p id="motd"></p>
      <p id="players"></p>
    </div>

    <script>
      async function refresh() {
        const res = await fetch("/api/status");
        const data = await res.json();
        const status = document.getElementById("status");
        const motd = document.getElementById("motd");
        const players = document.getElementById("players");

        if (data.online) {
          status.innerHTML = `🟢 <span class="online">Online</span> (${data.players.online}/${data.players.max})`;
          motd.innerText = data.motd?.clean?.join(" ") || "";
          players.innerText = data.players?.list?.length
            ? `Players: ${data.players.list.join(", ")}`
            : "No players online.";
        } else {
          status.innerHTML = `🔴 <span class="offline">Offline</span>`;
          motd.innerText = "";
          players.innerText = "";
        }
      }
      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
